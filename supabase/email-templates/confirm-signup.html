<!-- Supabase → Authentication → Emails → Confirm sign up
     Subject: TezDo'kon: tasdiqlash kodi {{ .Token }} -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#10172a">
  <p style="margin:0 0 20px;font-size:22px;font-weight:800">
    <span style="color:#0f2d6b">Tez</span><span style="color:#f7821b">Do'kon</span>
  </p>
  <h2 style="margin:0 0 8px;font-size:20px">Emailingizni tasdiqlang</h2>
  <p style="margin:0 0 20px;color:#5b6475">Ro'yxatdan o'tishni yakunlash uchun quyidagi kodni saytdagi maydonga kiriting:</p>
  <p style="margin:0 0 20px;padding:16px;background:#f5f7fb;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#0f2d6b">{{ .Token }}</p>
  <p style="margin:0 0 20px;color:#5b6475;font-size:14px">Yoki shu tugmani bosing:</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:12px 20px;background:#f7821b;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">Emailni tasdiqlash</a></p>
  <p style="margin:0;color:#8a92a3;font-size:12px">Agar siz ro'yxatdan o'tmagan bo'lsangiz, bu xatga e'tibor bermang.</p>
</div>
